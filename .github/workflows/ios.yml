name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bauen und testen
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simulator wählen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Tests mit Abdeckung
        run: |
          xcodebuild -project ChorAssistent.xcodeproj -scheme ChorAssistent \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage YES -resultBundlePath build/Tests.xcresult \
            test
          xcrun xccov view --report build/Tests.xcresult

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests.xcresult
          path: build/Tests.xcresult
          if-no-files-found: ignore

      - name: Lint
        run: swift format lint --strict --recursive ChorAssistent ChorAssistentTests

  ipa:
    name: Unsignierte IPA für Sideloadly
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archiv ohne Signatur bauen
        run: |
          xcodebuild -project ChorAssistent.xcodeproj -scheme ChorAssistent \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ChorAssistent.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: IPA packen
        run: |
          mkdir -p build/Payload
          cp -R build/ChorAssistent.xcarchive/Products/Applications/ChorAssistent.app build/Payload/
          cd build && zip -qry ChorAssistent.ipa Payload
          ls -lh ChorAssistent.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ChorAssistent-ipa
          path: build/ChorAssistent.ipa
          retention-days: 30
